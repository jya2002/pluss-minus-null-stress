name: Deploy approved release to GitHub Pages
# Deliberately manual: public deployment requires the board's approval.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Require production backend
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BASE_PATH: ${{ vars.VITE_BASE_PATH || '/pluss-minus-null-stress/' }}
        run: |
          test "$SUPABASE_URL" = 'https://unrdvalfkusnqhbfhber.supabase.co' || (echo 'VITE_SUPABASE_URL must match the approved PROD project'; exit 1)
          test -n "$PUBLIC_KEY" || (echo 'Set VITE_SUPABASE_PUBLISHABLE_KEY repository variable'; exit 1)
          test "$BASE_PATH" = '/pluss-minus-null-stress/' || (echo 'VITE_BASE_PATH must match the approved Pages path'; exit 1)
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/pluss-minus-null-stress/' }}
          VITE_DEMO_MODE: 'false'
          VITE_ENABLE_DEV_PASSWORD_LOGIN: 'false'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
